# SAG-RS workspace — virtual manifest.
# One crate per concept (see ARCHITECTURE.md "Crate layout"). Each crate exposes
# exactly one trait (its swap seam) at the top of its lib.rs, ships a `Fake` impl,
# and passes `cargo test -p <crate>` with no cluster, network, or GPU.
[workspace]
resolver = "2"
members = [
    "crates/sag-proto",
    "crates/sag-engine",
    "crates/sag-scheduler",
    "crates/sag-inference",
    "crates/sag-retrieval",
    "crates/sag-tools",
    "crates/sag-store",
    "crates/sag-node",
    "crates/sag-controller",
    "crates/sag-cli",
]
# The three binaries a homelab operator actually launches. Everything else is a
# library seam they compose. `cargo build` (no -p) builds just these.
default-members = [
    "crates/sag-cli",
    "crates/sag-controller",
    "crates/sag-node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.90"

# Shared dependency versions. Crates opt in by name with `workspace = true`.
# Deps arrive with the build-order step that needs them: the networked crates
# (axum/reqwest/sqlx/clap) land with the end-to-end `sag hello` milestone.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "sync",
    "signal",
] }
# LAN transport is axum + JSON for v1 (curl-debuggable); reqwest is the client
# side of the same wire. rustls (not native-tls) to avoid an OpenSSL build dep.
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
clap = { version = "4", features = ["derive", "env"] }
# Durable registry/state: sqlite over WAL; migrations embedded and run at startup.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal crates.
sag-proto = { path = "crates/sag-proto" }
sag-engine = { path = "crates/sag-engine" }
sag-scheduler = { path = "crates/sag-scheduler" }
sag-inference = { path = "crates/sag-inference" }
sag-retrieval = { path = "crates/sag-retrieval" }
sag-tools = { path = "crates/sag-tools" }
sag-store = { path = "crates/sag-store" }
sag-node = { path = "crates/sag-node" }
sag-controller = { path = "crates/sag-controller" }
